<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>報價單</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#f1f5f9;color:#1e293b;
  font-family:-apple-system,'Microsoft JhengHei','PingFang TC',sans-serif;
  font-size:15px;padding-bottom:40px;}
#loading{padding:60px 20px;text-align:center;color:#64748b;}
#notfound{padding:60px 20px;text-align:center;color:#64748b;}
.wrap{max-width:210mm;margin:0 auto;padding:16px;display:none;}
.wrap.show{display:block;}
.panel{background:#fff;border-radius:12px;border:1px solid #e2e8f0;padding:16px;margin-top:14px;}
.panel h2{font-size:14px;font-weight:700;margin-bottom:10px;}
.folder-btn{display:inline-flex;align-items:center;gap:6px;background:#2563eb;color:#fff;
  text-decoration:none;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;}
.folder-hint{font-size:12px;color:#64748b;margin-top:8px;line-height:1.6;}
.pay-sum{font-size:14px;margin-bottom:10px;}
.pay-sum b{color:#2563eb;}
.pf{display:flex;flex-direction:column;gap:8px;}
.pf input,.pf textarea{border:1px solid #e2e8f0;border-radius:8px;padding:10px;
  font-family:inherit;font-size:14px;}
.pf button{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:12px;
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
.pay-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;
  border-bottom:1px solid #e2e8f0;font-size:13px;}
.pay-row:last-child{border-bottom:none;}
.pay-st{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;}
.pay-st-待確認{background:#fef3c7;color:#92400e;}
.pay-st-已確認{background:#dcfce7;color:#166534;}
.pay-st-已駁回{background:#fee2e2;color:#991b1b;}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:#1e293b;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;
  z-index:200;opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none;}
#toast.show{opacity:1;}
@media print{ .panel{display:none!important;} }

/* ── Quote Render (kept identical to index.html's own copy) ── */
#pa{width:210mm;margin:20px auto;background:#fff;padding:14mm 15mm;
  font-family:'Microsoft JhengHei','PingFang TC',sans-serif;
  font-size:13px;box-shadow:0 0 20px rgba(0,0,0,.1);}
.p-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.p-logo{width:44%;min-height:80px;border:1px solid #aaa;display:flex;
  align-items:center;justify-content:center;overflow:hidden;}
.p-logo img{max-width:100%;max-height:90px;object-fit:contain;}
.p-logo-e{color:#999;font-size:14px;font-weight:bold;}
.p-meta{text-align:right;}
.p-meta table{border-collapse:collapse;margin-left:auto;}
.p-meta td{padding:3px 5px;}
.p-ml{color:#555;white-space:nowrap;}
.p-mv{font-weight:bold;padding-left:15px;}
.p-exp{color:#e74c3c;font-weight:bold;}
.p-info{display:flex;gap:24px;margin:14px 0;}
.p-ic{width:50%;}
.p-ir{display:flex;border-bottom:1px solid #e0e0e0;padding:4px 0;margin-bottom:2px;}
.p-il{min-width:90px;font-weight:bold;font-size:12px;color:#444;flex-shrink:0;}
.p-iv{font-size:12px;flex:1;}
.p-tbl{width:100%;border-collapse:collapse;margin:10px 0 4px;font-size:12px;}
.p-tbl th{background:#f0f0f0;border:1px solid #bbb;padding:6px 4px;text-align:center;font-size:12px;}
.p-tbl td{border:1px solid #ccc;padding:4px 6px;vertical-align:top;}
.t-no{width:28px;text-align:center;color:#666;}
.t-name{width:80px;font-weight:500;}
.t-spec{font-size:11px;color:#444;white-space:pre-wrap;}
.t-qty,.t-price,.t-sub{text-align:right;white-space:nowrap;}
.t-unit{text-align:center;width:35px;}
.t-sub{background:#fafafa;font-weight:bold;}
.p-sum{display:flex;justify-content:flex-end;margin:8px 0 12px;}
.p-sum table{border-collapse:collapse;min-width:200px;}
.p-sum td{border:1px solid #bbb;padding:5px 10px;}
.p-sum td:first-child{background:#f5f5f5;font-weight:bold;white-space:nowrap;}
.p-sum td:last-child{text-align:right;font-weight:bold;min-width:100px;}
.p-tr td{font-size:14px;font-weight:bold;}
.p-tv{color:#e74c3c;}
.p-ft{display:flex;gap:14px;}
.p-fb{flex:1;border:1px solid #999;padding:8px 10px;}
.p-fbt{font-weight:bold;font-size:12px;border-bottom:1px solid #e0e0e0;padding-bottom:4px;margin-bottom:6px;}
.p-fbc{font-size:12px;white-space:pre-wrap;line-height:1.7;}
@media print{
  body{background:#fff;overflow:auto;}
  #pa{box-shadow:none;margin:0;padding:12mm 14mm;}
}
@page{size:A4;margin:0;}
@media(max-width:430px){
  #pa{width:100%;padding:8px;font-size:11px;}
  .p-info{flex-direction:column;gap:0;}
  .p-ic{width:100%;}
}
</style>
</head>
<body>

<div id="loading">載入報價單中...</div>
<div id="notfound" style="display:none">找不到這份報價單，請確認連結是否正確。</div>

<div class="wrap" id="wrap">
  <div id="pa"></div>

  <div class="panel" id="folder-panel" style="display:none">
    <h2>協作資料夾</h2>
    <a class="folder-btn" id="folder-link" href="#" target="_blank">📁 開啟專屬資料夾</a>
    <div class="folder-hint">此資料夾僅開放給報價單上登記的 Email 存取，請用該 Google 帳號登入後再開啟連結。</div>
  </div>

  <div class="panel">
    <h2>收款進度</h2>
    <div class="pay-sum">已確認 <b id="paid-amt">$0</b> / 應收 <span id="total-amt">$0</span></div>
    <div id="ledger"></div>
  </div>

  <div class="panel">
    <h2>回報匯款</h2>
    <div class="pf">
      <input id="pf-amount" type="number" placeholder="匯款金額">
      <input id="pf-last5" placeholder="帳號末五碼（5 位數字）" maxlength="5">
      <textarea id="pf-note" rows="2" placeholder="備註（選填）"></textarea>
      <button onclick="submitPayment()">送出回報</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Quote-rendering helpers (kept identical to index.html's own copy) ──
function p(n){return String(n).padStart(2,'0');}
function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function driveUrl(url) {
  if (!url) return '';
  const m = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return `https://lh3.googleusercontent.com/d/${m[1]}`;
  return url;
}

function buildQuoteHtml(q, cfg) {
  const lu=driveUrl(q.logo===2?cfg.LOGO_2_URL:cfg.LOGO_1_URL);
  let exp='—';
  if(q.rawDate||q.date){
    const b=new Date((q.rawDate||q.date).replace(/\//g,'-'));
    b.setDate(b.getDate()+(q.validDays||7));
    exp=`${b.getFullYear()}/${p(b.getMonth()+1)}/${p(b.getDate())}`;
  }
  const dd=q.rawDate?q.rawDate.replace(/-/g,'/'):q.date||'';
  const rowsHtml=(q.items||[]).map((it,i)=>{
    const pr=parseFloat(String(it.price||'').replace(/,/g,''))||0;
    const qty=parseFloat(it.qty)||0, sub=pr*qty;
    const gift=String(it.price||'').trim()==='贈送';
    return `<tr>
      <td class="t-no">${i+1}</td><td class="t-name">${e(it.name||'')}</td>
      <td class="t-spec">${e(it.spec||'')}</td>
      <td class="t-qty">${qty}</td><td class="t-unit">${e(it.unit||'式')}</td>
      <td class="t-price">${gift?'贈送':pr.toLocaleString()}</td>
      <td class="t-sub">${gift?'贈送':sub.toLocaleString()}</td>
      <td>${e(it.remark||'')}</td></tr>`;
  }).join('');
  const blanks=Math.max(0,5-(q.items||[]).length);
  const blankHtml=Array(blanks).fill(`<tr><td class="t-no" style="color:#ddd">&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td class="t-sub"></td><td></td></tr>`).join('');

  return `
    <div class="p-hdr">
      <div class="p-logo">${lu?`<img src="${lu}" onerror="this.parentElement.innerHTML='<span class=\\'p-logo-e\\'>公司LOGO</span>'" alt="LOGO">`:'<span class="p-logo-e">公司LOGO</span>'}</div>
      <div class="p-meta"><table>
        <tr><td class="p-ml">報價編號：</td><td class="p-mv">${e(q.no||'草稿')}</td></tr>
        <tr><td class="p-ml">報價有效期限(天)：</td><td class="p-mv">${q.validDays||7}</td></tr>
        <tr><td class="p-ml">報價日期：</td><td class="p-mv">${dd}</td></tr>
        <tr><td class="p-ml">報價至期限：</td><td class="p-mv p-exp">${exp}</td></tr>
      </table></div>
    </div>
    <div class="p-info">
      <div class="p-ic">
        <div class="p-ir"><span class="p-il">公司名稱：</span><span class="p-iv">${e(cfg.COMPANY_NAME||'')}</span></div>
        <div class="p-ir"><span class="p-il">聯絡地址：</span><span class="p-iv">${e(cfg.COMPANY_ADDRESS||'')}</span></div>
        <div class="p-ir"><span class="p-il">電話/Email：</span><span class="p-iv">${e(cfg.COMPANY_PHONE||'')}</span></div>
        <div class="p-ir"><span class="p-il">統一編號：</span><span class="p-iv">${e(cfg.COMPANY_TAX_ID||'')}</span></div>
      </div>
      <div class="p-ic">
        <div class="p-ir"><span class="p-il">客戶公司：</span><span class="p-iv">${e(q.client||'')}</span></div>
        <div class="p-ir"><span class="p-il">電話：</span><span class="p-iv">${e(q.phone||'')}</span></div>
        <div class="p-ir"><span class="p-il">聯絡人：</span><span class="p-iv">${e(q.contact||'')}</span></div>
        <div class="p-ir"><span class="p-il">Email：</span><span class="p-iv">${e(q.email||'')}</span></div>
      </div>
    </div>
    <table class="p-tbl"><thead><tr>
      <th style="width:28px">項次</th><th style="width:80px">品名</th>
      <th>規格說明</th><th style="width:38px">數量</th>
      <th style="width:35px">單位</th><th style="width:70px">單價(未稅)</th>
      <th style="width:70px">小計</th><th style="width:65px">備註</th>
    </tr></thead><tbody>${rowsHtml}${blankHtml}</tbody></table>
    <div class="p-sum"><table>
      <tr><td>未稅小計</td><td>${(q.subtotal||0).toLocaleString()}</td></tr>
      <tr><td>營業稅 5%</td><td>${(q.tax||0).toLocaleString()}</td></tr>
      <tr class="p-tr"><td>總計金額（含稅）</td><td class="p-tv">${(q.total||0).toLocaleString()}</td></tr>
    </table></div>
    <div class="p-ft">
      <div class="p-fb"><div class="p-fbt">付款條件：</div>
        <div class="p-fbc">${e(q.payment||'')}</div></div>
      <div class="p-fb"><div class="p-fbt">備註與條款：</div>
        <div class="p-fbc">${e(q.notes||'')}</div></div>
    </div>
    ${(cfg.BANK_NAME||cfg.BANK_ACCOUNT)?`
    <div style="margin-top:10px;border:1px solid #999;padding:8px 10px;">
      <div class="p-fbt">收款銀行資訊：</div>
      <div style="display:grid;grid-template-columns:60px 1fr 60px 1fr;gap:6px 8px;margin-top:6px;font-size:12px;">
        <span style="color:#555">銀行名稱</span><span>${e(cfg.BANK_NAME||'')}</span>
        <span style="color:#555">銀行代碼</span><span>${e(cfg.BANK_CODE||'')}</span>
        <span style="color:#555">戶　　名</span><span>${e(cfg.BANK_HOLDER||'')}</span>
        <span style="color:#555">帳　　號</span><span>${e(cfg.BANK_ACCOUNT||'')}</span>
      </div>
    </div>`:''}
    `;
}

const token = new URLSearchParams(location.search).get('token');
let DATA = null;

window.addEventListener('DOMContentLoaded', () => {
  if (!token) { showNotFound(); return; }
  google.script.run
    .withSuccessHandler(d => { if (!d) { showNotFound(); return; } DATA = d; render(); })
    .withFailureHandler(showNotFound)
    .getQuoteByToken(token);
});

function showNotFound() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('notfound').style.display = 'block';
}

function render() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('wrap').classList.add('show');
  document.getElementById('pa').innerHTML = buildQuoteHtml(DATA.quote, DATA.config);

  if (DATA.folderUrl) {
    document.getElementById('folder-panel').style.display = 'block';
    document.getElementById('folder-link').href = DATA.folderUrl;
  }

  document.getElementById('paid-amt').textContent = '$' + (DATA.paidConfirmed||0).toLocaleString();
  document.getElementById('total-amt').textContent = '$' + (DATA.quote.total||0).toLocaleString();

  const ledger = DATA.ledger || [];
  document.getElementById('ledger').innerHTML = ledger.length
    ? ledger.map(p => `
      <div class="pay-row">
        <span>$${p.amount.toLocaleString()} ${p.last5?'（末五碼 '+e(p.last5)+'）':''}<br><small style="color:#94a3b8">${p.time}</small></span>
        <span class="pay-st pay-st-${p.status}">${p.status}</span>
      </div>`).join('')
    : '<div style="color:#94a3b8;font-size:13px">尚無回報記錄</div>';
}

function submitPayment() {
  const amount = document.getElementById('pf-amount').value;
  const last5  = document.getElementById('pf-last5').value.trim();
  const note   = document.getElementById('pf-note').value;
  if (!amount || Number(amount) <= 0) { toast('請輸入正確的金額'); return; }
  if (!/^\d{5}$/.test(last5)) { toast('末五碼需為 5 位數字'); return; }
  google.script.run
    .withSuccessHandler(() => {
      toast('已送出，請等候確認');
      document.getElementById('pf-amount').value = '';
      document.getElementById('pf-last5').value = '';
      document.getElementById('pf-note').value = '';
      google.script.run.withSuccessHandler(d => { DATA = d; render(); }).getQuoteByToken(token);
    })
    .withFailureHandler(err => toast(err && err.message ? err.message : '送出失敗，請重試'))
    .reportPayment(token, amount, last5, note);
}

function toast(msg, ms=2800) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), ms);
}
</script>
</body>
</html>
